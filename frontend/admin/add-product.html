<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product | Mimi Luxe Admin</title>
    <link rel="stylesheet" href="css/admin.css">

</head>


<body class="admin-body">


<header class="admin-header">

    <nav class="admin-nav">

        <a
            href="dashboard.html"
            class="admin-logo"
        >
            Mimi Luxe
            <span>Administration</span>
        </a>


        <div class="admin-nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="add-product.html">
               + Add Product
            </a>

            <a href="../customer/index.html">
                View Store
            </a>

            <a
                href="#"
                id="admin-logout"
                class="admin-nav-logout"
            >
                Logout
            </a>

            <a
                href="store-settings.html"
            >
                Store Settings
            </a>

        </div>


        <button
            type="button"
            id="admin-menu-toggle"
            class="admin-menu-toggle"
            aria-label="Open menu"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </nav>

</header>


<main class="admin-main admin-page">


    <section class="admin-page-heading">

        <p class="eyebrow">
            CATALOGUE
        </p>

        <h1>
            Add Product
        </h1>

        <p>
            Add a new product to the Mimi Luxe catalogue.
        </p>

    </section>


    <section class="admin-form-card">


        <form
            id="add-product-form"
            class="admin-form"
        >


            <div class="admin-form-row">

                <div class="admin-form-group">

                    <label for="product-name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="product-name"
                        required
                    >

                </div>


                <div class="admin-form-group">

                    <label for="product-brand">
                        Brand
                    </label>

                    <input
                        type="text"
                        id="product-brand"
                        required
                    >

                </div>

            </div>


            <div class="admin-form-row">

                <div class="admin-form-group">

                    <label for="product-category">
                        Category
                    </label>

                    <input
                        type="text"
                        id="product-category"
                        required
                    >

                </div>


                <div class="admin-form-group">

                    <label for="product-price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="product-price"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>

            </div>


            <div class="admin-form-group">

                <label for="product-description">
                    Description
                </label>

                <textarea
                    id="product-description"
                    placeholder="Describe the product..."
                ></textarea>

            </div>


            <div class="admin-form-row">

                <div class="admin-form-group">

                    <label for="product-stock">
                        Stock Quantity
                    </label>

                    <input
                        type="number"
                        id="product-stock"
                        min="0"
                        value="0"
                        required
                    >

                </div>


                <div class="admin-form-group">
                    <label for="product-image">
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="product-image"
                        name="product-image"
                        accept="image/jpeg,image/png,image/webp,image/gif"
                    >

                    <small class="admin-form-help">
                        Choose an image from your phone or computer.
                    </small>

                    <div id="image-preview-container" class="admin-image-preview-container">
                        <img
                            id="image-preview"
                            class="admin-image-preview"
                            src=""
                            alt="Image preview"
                            hidden
                        >
                    </div>


                    
                    
                </div>
                
                <div class="admin-form-group">
                    <label for="image_url">Image URL</label>

                    <input type="url" id="product-image-url" name="image_url" placeholder="https://example.com/product-image.jpg" autocomplete="off">
                    <small>Or paste an image URL if you dont want to upload a file.</small>
                </div>
                

            <label
                class="admin-check-card"
                for="product-available"
            >

                <input
                    type="checkbox"
                    id="product-available"
                    checked
                >

                <div>

                    <strong>
                        Product is available
                    </strong>

                    <span>
                        Customers can see and purchase this product.
                    </span>

                </div>

            </label>


            <div class="admin-form-actions">

                <a
                    href="dashboard.html"
                    class="admin-btn admin-btn-secondary"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="admin-btn admin-btn-primary"
                >
                    Add Product
                </button>

            </div>


            <p
                id="add-product-message"
                class="admin-message"
            ></p>


        </form>

    </section>

</main>


<script src="js/admin-nav.js"></script>
<script src="js/add-product.js"></script>

</body>
</html>
