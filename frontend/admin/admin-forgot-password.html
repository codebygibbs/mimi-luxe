<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Forgot Password | Mimi Luxe</title>

    <link rel="stylesheet" href="../admin/css/admin.css">
</head>

<body class="admin-auth-page">

    <main class="admin-auth-page">

        <section class="admin-auth-card">

            <div class="admin-auth-header">
                <p class="admin-auth-eyebrow">Mimi Luxe Admin</p>

                <h1>Forgot Password?</h1>

                <p>
                    Enter your admin email address and we'll help you reset
                    your password.
                </p>
            </div>

            <form id="admin-forgot-password-form">

                <div class="admin-form-group">

                    <label for="admin-email">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        name="email"
                        placeholder="Enter your admin email"
                        autocomplete="email"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="admin-primary-button"
                    id="admin-forgot-button"
                >
                    Send Reset Link
                </button>

            </form>

            <div
                id="admin-forgot-message"
                class="admin-auth-message"
                hidden
            ></div>

            <div class="admin-auth-links">

                <a href="login.html">
                    Back to Admin Login
                </a>

            </div>

        </section>

    </main>

    <script src="../admin/js/admin-forgot-password.js"></script>

</body>
</html>
