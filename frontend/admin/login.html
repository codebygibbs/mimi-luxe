 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Mimi Luxe</title>
    <link rel="stylesheet" href="css/admin.css">
</head>


<body class="admin-auth-page">

<main class="admin-auth-container">

    <section class="admin-auth-card">

        <a
            href="../customer/index.html"
            class="admin-auth-logo"
        >
            Mimi Luxe
        </a>

        <p class="admin-page-heading eyebrow">
            ADMINISTRATION
        </p>

        <h1>Welcome back</h1>

        <p class="admin-auth-description">
            Sign in to manage products, orders and customers.
        </p>


        <form
            id="admin-login-form"
            class="admin-auth-form"
        >

            <div class="admin-form-group">

                <label for="admin-email">
                    Email
                </label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="admin@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="admin-form-group">

                <label for="admin-password">
                    Password
                </label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <div class="admin-auth-forgot-link">
                <a href="admin-forgot-password.html">
                    Forgot password?
                </a>
            </div>


            <button
                type="submit"
                class="admin-auth-button"
            >
                Sign In
            </button>


            <p
                id="admin-login-message"
                class="admin-message"
            ></p>

        </form>


        <div class="admin-auth-footer">

            Don't have an admin account?

            <a href="admin-register.html">
                Create one
            </a>

        </div>

    </section>

</main>


<script src="js/admin-login.js"></script>

</body>
</html>
