<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Admin Password | Mimi Luxe</title>

    <link rel="stylesheet" href="../admin/css/admin.css">
</head>

<body class="admin-auth-page">

    <main class="admin-auth-page">

        <section class="admin-auth-card">

            <div class="admin-auth-header">

                <p class="admin-auth-eyebrow">
                    Mimi Luxe Admin
                </p>

                <h1>Reset Password</h1>

                <p>
                    Create a new password for your admin account.
                </p>

            </div>


            <form id="admin-reset-password-form">

                <div class="admin-form-group">

                    <label for="new-password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new-password"
                        name="new-password"
                        placeholder="Enter new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="admin-form-group">

                    <label for="confirm-password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-primary-button"
                    id="admin-reset-button"
                >
                    Reset Password
                </button>

            </form>


            <div
                id="admin-reset-message"
                class="admin-auth-message"
                hidden
            ></div>


            <div class="admin-auth-links">

                <a href="login.html">
                    Back to Admin Login
                </a>

            </div>

        </section>

    </main>


    <script src="../admin/js/admin-reset-password.js"></script>

</body>
</html>
