<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Forgot Password | Mimi Luxe</title>

  <link rel="stylesheet" href="../customer/css/customer.css">
</head>

<body class="customer-body">

  <main class="auth-page">

    <section class="card auth-card">

      <div class="auth-heading">

        <p class="eyebrow">
          Mimi Luxe
        </p>

        <h1>
          Forgot your password?
        </h1>

        <p>
          Enter the email address connected to your account
          and we'll help you reset your password.
        </p>

      </div>


      <form id="forgot-password-form">

        <div class="form-group">

          <label for="forgot-email">
            Email address
          </label>

          <input
            type="email"
            id="forgot-email"
            name="email"
            autocomplete="email"
            required
          >

        </div>


        <div
          id="forgot-password-message"
          class="form-message"
          aria-live="polite"
        ></div>


        <button
          type="submit"
          class="btn btn-primary"
        >
          Send reset link
        </button>

      </form>


      <div class="auth-footer">

        <a href="login.html">
          Back to login
        </a>

      </div>

    </section>

  </main>

  <footer id="customer-footer" class="site-footer"></footer>

  <script src="js/forgot-password.js"></script>
  <script src="js/customer-common.js"></script>
</body>
</html>
