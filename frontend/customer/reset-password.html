<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password | Mimi Luxe</title>

  <link rel="stylesheet" href="../customer/css/customer.css">
</head>

<body class="customer-body">

  <main class="auth-page">

    <section class="card auth-card">

      <div class="auth-heading">

        <p class="eyebrow">
          Mimi Luxe
        </p>

        <h1>
          Create a new password
        </h1>

        <p>
          Choose a new password for your account.
        </p>

      </div>


      <form id="reset-password-form">

        <div class="form-group">

          <label for="new-password">
            New password
          </label>

          <input
            type="password"
            id="new-password"
            name="new_password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          >

        </div>


        <div class="form-group">

          <label for="confirm-password">
            Confirm new password
          </label>

          <input
            type="password"
            id="confirm-password"
            name="confirm_password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          >

        </div>


        <div
          id="reset-password-message"
          class="form-message"
          aria-live="polite"
        ></div>


        <button
          type="submit"
          class="btn btn-primary"
        >
          Reset password
        </button>

      </form>


      <div class="auth-footer">

        <a href="login.html">
          Back to login
        </a>

      </div>

    </section>

  </main>

  <footer id="customer-footer" class="site-footer"></footer>

  <script src="js/reset-password.js"></script>
  <script src="js/customer-common.js"></script>
</body>
</html>
