<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Mimi Luxe</title>
    <link rel="stylesheet" href="css/customer.css">
</head>

<body class="customer-body">

<header class="site-header">
    <nav class="site-nav container">
        <a class="site-logo" href="index.html">
            Mimi Luxe
            <span>Beauty • Fragrance • Skincare</span>
        </a>

        <div class="nav-links" id="nav-links">
            <a href="index.html" data-i18n="home">Home</a>
            <a href="products.html" data-i18n="shop">Shop</a>
            <a href="orders.html" data-auth="logged-in" data-i18n="orders">Orders</a>
            <a href="account.html" data-i18n="account">Account</a>
        </div>

        <div class="nav-tools">
            <label class="sr-only" for="language-select" data-i18n="language">Language</label>
            <select id="language-select" class="nav-tool language-select" aria-label="Language"></select>

            <a class="nav-tool cart-link" href="cart.html" aria-label="Cart">
                <img class="cart-icon" src="assets/icons/cart.svg" alt="" aria-hidden="true">
                <span class="sr-only" data-i18n="cart">Cart</span>
                <span class="cart-count">0</span>
            </a>

            <button type="button" id="menu-toggle" class="menu-toggle" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
</header>

<main class="site-main page-container">

    <section class="card order-success-page" aria-labelledby="order-success-title">

        <div class="order-success-hero">
            <div class="order-success-icon" aria-hidden="true">✓</div>

            <div class="section-heading">
                <p class="eyebrow">Mimi Luxe</p>
                <h1 id="order-success-title" data-i18n="orderPlaced">
                    Your order has been placed.
                </h1>
                <p data-i18n="reviewOrder">
                    Review your order, items and current status.
                </p>
            </div>
        </div>

        <div id="order-success-content" class="order-success-content" aria-live="polite">
            <p class="order-success-loading" data-i18n="loadingOrder">Loading order...</p>
        </div>

        <div class="order-success-actions">
            <a href="orders.html" class="btn btn-primary" data-i18n="backToOrders">
                Back to My Orders
            </a>
            <a href="products.html" class="btn btn-secondary" data-i18n="continueShopping">
                Continue Shopping
            </a>
        </div>

    </section>

</main>

<footer id="customer-footer" class="site-footer"></footer>

<!-- Shared customer code must load first: it owns language, cart and navigation. -->
<script src="js/customer-common.js"></script>
<script src="js/order-success.js"></script>

</body>
</html>
